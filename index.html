<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyVerse | Premium Video Study Library</title>
  
  <!-- Modern Inter & Plus Jakarta Sans typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for crisp UI iconography -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-elevated: #162032;
      --card-hover: #1c2940;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #6366f1;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-glow: rgba(239, 68, 68, 0.25);
      --amber: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.25);
      --emerald: #10b981;
      --yt-red: #ff0000;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      padding: 30px 16px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 940px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
    }

    .brand-title {
      font-size: 2.35rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #c7d2fe 0%, #818cf8 40%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .brand-subtitle {
      color: var(--text-muted);
      margin-top: 8px;
      font-size: 0.96rem;
      font-weight: 400;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--emerald);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-top: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--emerald);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--emerald);
    }

    .form-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 36px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      position: relative;
      overflow: hidden;
    }

    .form-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .text-input {
      background: rgba(9, 13, 22, 0.7);
      border: 1.5px solid var(--border-subtle);
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .text-input:focus {
      border-color: var(--primary);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    textarea.text-input {
      height: 125px;
      resize: vertical;
      line-height: 1.55;
      font-family: monospace, system-ui;
      font-size: 13.5px;
    }

    .btn-gradient {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      box-shadow: 0 8px 20px var(--primary-glow);
      transition: all 0.2s ease;
    }

    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.45);
    }

    .btn-gradient:active {
      transform: translateY(0);
    }

    .btn-gradient:disabled {
      background: #334155;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      color: #94a3b8;
    }

    .tabs-header-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .tabs-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subject-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 16px;
      margin-bottom: 22px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) transparent;
    }

    .subject-tabs::-webkit-scrollbar {
      height: 6px;
    }
    .subject-tabs::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 10px;
    }

    .tab-item {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-item:hover {
      background: var(--card-elevated);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.18);
    }

    .tab-item.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 16px var(--primary-glow);
    }

    .tab-count {
      font-size: 11px;
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 8px;
      border-radius: 9999px;
    }

    .unit-box {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      margin-bottom: 20px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .unit-head {
      background: rgba(22, 32, 50, 0.7);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease;
    }

    .unit-head:hover {
      background: rgba(28, 41, 64, 0.85);
    }

    .unit-title-text {
      font-size: 1.12rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .unit-pill {
      font-size: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      padding: 3px 10px;
      border-radius: 9999px;
      font-weight: 600;
    }

    .topic-list-group {
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .topic-card {
      background: rgba(10, 15, 26, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .topic-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      background: rgba(19, 27, 46, 0.95);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .card-meta-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .index-bubble {
      width: 36px;
      height: 36px;
      min-width: 36px;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
    }

    .topic-info-wrap {
      flex: 1;
      min-width: 0;
    }

    .topic-header-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .topic-heading {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-backup {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .topic-subheading {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .action-btn-del {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .action-btn-del:hover {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 4px 14px var(--danger-glow);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 16, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-dialog {
      background: #111827;
      border: 1px solid var(--border-subtle);
      width: 100%;
      max-width: 620px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
      animation: modalSlide 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    @keyframes modalSlide {
      from { transform: scale(0.95) translateY(10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-tag {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.2);
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .modal-topic-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 18px;
      line-height: 1.35;
    }

    .details-grid {
      background: rgba(10, 15, 26, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .detail-row {
      font-size: 0.94rem;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.45;
    }

    .detail-label {
      color: var(--text-muted);
      font-weight: 600;
      min-width: 110px;
    }

    .detail-value {
      color: #f1f5f9;
      font-weight: 500;
      word-break: break-word;
    }

    .btn-youtube-launch {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: white;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 18px var(--danger-glow);
      transition: all 0.2s ease;
    }

    .btn-youtube-launch:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(239, 68, 68, 0.4);
    }

    .backup-container {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px dashed var(--border-subtle);
    }

    .backup-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .backup-heading {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-outline-amber {
      background: transparent;
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fcd34d;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-outline-amber:hover {
      background: rgba(245, 158, 11, 0.15);
      border-color: #f59e0b;
    }

    .backup-view-card {
      background: rgba(245, 158, 11, 0.05);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 12px;
      padding: 16px;
      margin-top: 10px;
    }

    .btn-close-modal {
      margin-top: 24px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: #cbd5e1;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-close-modal:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .toast-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #fff;
      padding: 14px 22px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      z-index: 10000;
      animation: toastIn 0.25s ease-out;
    }

    @keyframes toastIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 2.5rem;
      color: #475569;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-title">
        <i class="fa-solid fa-graduation-cap"></i> StudyVerse
      </div>
      <p class="brand-subtitle">સબ્જેક્ટ અને યુનિટ મુજબ પ્લેલિસ્ટ અને વિડિયોઝની સ્માર્ટ લાઇબ્રેરી</p>
      <div class="status-badge">
        <span class="status-dot"></span> Firebase Cloud Connected
      </div>
    </header>

    <!-- NEW INPUT PANEL -->
    <div class="form-panel">
      <div class="grid-2">
        <div class="input-wrapper">
          <label class="input-label" for="subjectInput">
            <i class="fa-solid fa-book-bookmark"></i> સબ્જેક્ટ (Subject / Album)
          </label>
          <input type="text" id="subjectInput" class="text-input" placeholder="દા.ત. Mathematics-1" value="Mathematics-1" list="subjectDatalist">
          <datalist id="subjectDatalist"></datalist>
        </div>

        <div class="input-wrapper">
          <label class="input-label" for="unitInput">
            <i class="fa-solid fa-folder-open"></i> યુનિટ (Unit)
          </label>
          <input type="text" id="unitInput" class="text-input" placeholder="દા.ત. Unit-1" value="Unit-1" list="unitDatalist">
          <datalist id="unitDatalist"></datalist>
        </div>
      </div>

      <div class="input-wrapper">
        <label class="input-label" for="rawInput">
          <i class="fa-solid fa-paste"></i> વિગત પેસ્ટ કરો (Raw Template Input)
        </label>
        <textarea id="rawInput" class="text-input" placeholder="🎯 Topic: [2×2 / 3×3 નિશ્ચાયકનું મૂલ્ય]
🏆 BEST VIDEO FOR YOU
· 🎥 Video Title: Unit-1: Determinant & Function...
· 👨‍🏫 Channel: Dr R. C. Bhatt Maths
· ⏱️ Duration: પ્લેલિસ્ટ
· 🔗 YouTube Link: https://..."></textarea>
      </div>

      <button class="btn-gradient" id="btnSubmit" onclick="addNewTopic()">
        <i class="fa-solid fa-cloud-arrow-up"></i> આ યુનિટમાં ટોપિક સેવ કરો
      </button>
    </div>

    <!-- SUBJECT ALBUM NAVIGATION -->
    <div class="tabs-header-wrap">
      <div class="tabs-title">
        <i class="fa-solid fa-layer-group"></i> વિષય પસંદ કરો (Subjects)
      </div>
    </div>
    <div class="subject-tabs" id="subjectTabsContainer"></div>

    <!-- UNITS & TOPICS DISPLAY -->
    <div id="unitListsContainer"></div>
  </div>

  <div class="modal-backdrop" id="detailModal">
    <div class="modal-dialog">
      <span class="modal-tag"><i class="fa-solid fa-trophy"></i> Best Video For You</span>
      <h3 class="modal-topic-title" id="modalTopic">Topic Heading</h3>

      <div class="details-grid">
        <div class="detail-row">
          <span class="detail-label"><i class="fa-solid fa-video"></i> Video Title:</span>
          <span class="detail-value" id="modalTitle"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-solid fa-chalkboard-user"></i> Channel:</span>
          <span class="detail-value" id="modalChannel"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fa-solid fa-clock"></i> Duration:</span>
          <span class="detail-value" id="modalDuration"></span>
        </div>
      </div>

      <a id="modalYtLink" href="#" target="_blank" rel="noopener noreferrer" class="btn-youtube-launch">
        <i class="fa-brands fa-youtube"></i> YouTube પર ખોલો
      </a>

      <!-- BACKUP VIDEO SECTION -->
      <div class="backup-container">
        <div class="backup-top-bar">
          <span class="backup-heading">
            <i class="fa-solid fa-rotate"></i> Backup Video
          </span>
          <button class="btn-outline-amber" onclick="toggleBackupForm()">
            <i class="fa-solid fa-plus"></i> Backup ઉમેરો / બદલો
          </button>
        </div>

        <div id="backupDisplay"></div>

        <div id="backupFormWrap" style="display: none; margin-top: 14px;">
          <textarea id="backupRawInput" class="text-input" style="height: 100px; width: 100%;" placeholder="બેકઅપ વિડિયો માટેનો વિગતવાર ટેક્સ્ટ અહીં પેસ્ટ કરો..."></textarea>
          <button class="btn-gradient" id="btnSaveBackup" style="background: #f59e0b; box-shadow: 0 4px 14px var(--amber-glow); margin-top: 8px;" onclick="saveBackupVideo()">
            <i class="fa-solid fa-floppy-disk"></i> Backup સેવ કરો
          </button>
        </div>
      </div>

      <button class="btn-close-modal" onclick="closeModal()">
        <i class="fa-solid fa-xmark"></i> બંધ કરો (Close)
      </button>
    </div>
  </div>

  <!-- TOAST COMPONENT -->
  <div class="toast-popup" id="toastBox">
    <i class="fa-solid fa-circle-check" style="color: var(--emerald);"></i>
    <span id="toastMsg">Action Successful</span>
  </div>

  <script>
    const FIREBASE_BASE_URL = "https://primium-videos-boating-default-rtdb.firebaseio.com/topics";
    let topicsCache = [];
    let currentActiveSubject = "Mathematics-1";
    let activeTopicId = null;

    // Toast alert helper
    function showToast(message, isError = false) {
      const toast = document.getElementById('toastBox');
      const icon = toast.querySelector('i');
      toast.querySelector('#toastMsg').innerText = message;
      
      if (isError) {
        icon.className = "fa-solid fa-triangle-exclamation";
        icon.style.color = "var(--danger)";
      } else {
        icon.className = "fa-solid fa-circle-check";
        icon.style.color = "var(--emerald)";
      }

      toast.style.display = 'flex';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3500);
    }

    function parseCustomText(text) {
      const topicMatch = text.match(/Topic:\s*\[?(.*?)\]?(?:\n|$)/i);
      const titleMatch = text.match(/Video Title:\s*(.*?)(?:\n|$)/i);
      const channelMatch = text.match(/Channel:\s*(.*?)(?:\n|$)/i);
      const durationMatch = text.match(/Duration:\s*(.*?)(?:\n|$)/i);
      const linkMatch = text.match(/(https?:\/\/[^\s]+)/i);

      return {
        topic: topicMatch ? topicMatch[1].trim() : "નવો ટોપિક",
        title: titleMatch ? titleMatch[1].trim() : "વિડિયો ટાઈટલ મળ્યું નથી",
        channel: channelMatch ? channelMatch[1].trim() : "-",
        duration: durationMatch ? durationMatch[1].trim() : "-",
        link: linkMatch ? linkMatch[1].trim() : "#"
      };
    }

    async function fetchTopics() {
      try {
        const response = await fetch(`${FIREBASE_BASE_URL}.json`);
        const data = await response.json();

        if (!data) {
          topicsCache = [];
          renderSubjects();
          return;
        }

        // Migration logic: Fallback to "Mathematics-1" and "Unit-1" for legacy records
        // Sorting: Ascending by createdAt (Oldest First: 1st, 2nd, 3rd)
        topicsCache = Object.keys(data).map(key => {
          const item = data[key];
          return {
            id: key,
            ...item,
            subject: item.subject && item.subject.trim() ? item.subject.trim() : "Mathematics-1",
            unit: item.unit && item.unit.trim() ? item.unit.trim() : "Unit-1"
          };
        }).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

        renderSubjects();
      } catch (err) {
        console.error("Firebase fetch error:", err);
        showToast("ડેટાબેઝમાંથી ડેટા લોડ કરવામાં સમસ્યા આવી!", true);
      }
    }

    function renderSubjects() {
      const container = document.getElementById('subjectTabsContainer');
      const subjectList = document.getElementById('subjectDatalist');
      
      const distinctSubjects = [...new Set(topicsCache.map(t => t.subject))];
      if (!distinctSubjects.includes("Mathematics-1")) {
        distinctSubjects.unshift("Mathematics-1");
      }

      if (!distinctSubjects.includes(currentActiveSubject)) {
        currentActiveSubject = distinctSubjects[0];
      }

      // Populate datalist for autocomplete
      subjectList.innerHTML = distinctSubjects.map(s => `<option value="${s}">`).join('');

      // Build top tabs
      container.innerHTML = distinctSubjects.map(sub => {
        const count = topicsCache.filter(t => t.subject === sub).length;
        const isActive = sub === currentActiveSubject;
        return `
          <button class="tab-item ${isActive ? 'active' : ''}" onclick="selectSubject('${sub.replace(/'/g, "\\'")}')">
            <i class="fa-solid fa-bookmark"></i> ${sub}
            <span class="tab-count">${count}</span>
          </button>
        `;
      }).join('');

      renderUnits();
    }

    function selectSubject(sub) {
      currentActiveSubject = sub;
      document.getElementById('subjectInput').value = sub;
      renderSubjects();
    }

    function renderUnits() {
      const unitsContainer = document.getElementById('unitListsContainer');
      const unitDatalist = document.getElementById('unitDatalist');

      const subjectTopics = topicsCache.filter(t => t.subject === currentActiveSubject);
      const distinctUnits = [...new Set(subjectTopics.map(t => t.unit))];

      unitDatalist.innerHTML = distinctUnits.map(u => `<option value="${u}">`).join('');

      if (distinctUnits.length === 0) {
        unitsContainer.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-box-open"></i>
            <p>આ વિષયમાં હજુ સુધી કોઈ ટોપિક ઉમેરાયા નથી.</p>
            <p style="font-size: 13px; margin-top: 6px;">ઉપરના ફોર્મમાં વિગત પેસ્ટ કરીને સેવ કરો!</p>
          </div>
        `;
        return;
      }

      unitsContainer.innerHTML = distinctUnits.map(unitName => {
        const unitItems = subjectTopics.filter(t => t.unit === unitName);
        return `
          <div class="unit-box">
            <div class="unit-head">
              <span class="unit-title-text">
                <i class="fa-solid fa-folder-tree" style="color: var(--primary);"></i> ${unitName}
              </span>
              <span class="unit-pill">${unitItems.length} Topics</span>
            </div>
            <div class="topic-list-group">
              ${unitItems.map((topicItem, index) => `
                <div class="topic-card" onclick="openDetailModal('${topicItem.id}')">
                  <div class="card-meta-left">
                    <div class="index-bubble">${index + 1}</div>
                    <div class="topic-info-wrap">
                      <div class="topic-header-row">
                        <span class="topic-heading">🎯 ${topicItem.topic}</span>
                        ${topicItem.backup ? `<span class="badge-backup"><i class="fa-solid fa-rotate"></i> Backup</span>` : ''}
                      </div>
                      <div class="topic-subheading">
                        <span><i class="fa-solid fa-chalkboard-user"></i> ${topicItem.channel}</span>
                        <span><i class="fa-solid fa-clock"></i> ${topicItem.duration}</span>
                      </div>
                    </div>
                  </div>
                  <button class="action-btn-del" onclick="deleteTopic(event, '${topicItem.id}')" title="Delete Topic">
                    <i class="fa-solid fa-trash-can"></i> ડિલીટ
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    async function addNewTopic() {
      const subject = document.getElementById('subjectInput').value.trim() || "Mathematics-1";
      const unit = document.getElementById('unitInput').value.trim() || "Unit-1";
      const rawText = document.getElementById('rawInput').value.trim();
      const submitBtn = document.getElementById('btnSubmit');

      if (!rawText) {
        showToast("કૃપા કરીને પહેલા ટેક્સ્ટ પેસ્ટ કરો!", true);
        return;
      }

      const parsed = parseCustomText(rawText);
      const newTopicPayload = {
        subject,
        unit,
        topic: parsed.topic,
        title: parsed.title,
        channel: parsed.channel,
        duration: parsed.duration,
        link: parsed.link,
        createdAt: Date.now(),
        backup: null
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> સેવ થઈ રહ્યું છે...`;

      try {
        const res = await fetch(`${FIREBASE_BASE_URL}.json`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newTopicPayload)
        });

        if (res.ok) {
          document.getElementById('rawInput').value = '';
          currentActiveSubject = subject;
          await fetchTopics();
          showToast("ટોપિક સફળતાપૂર્વક ઉમેરાઈ ગયો!");
        } else {
          showToast("ડેટા સેવ કરવામાં નિષ્ફળતા!", true);
        }
      } catch (err) {
        console.error("Add topic error:", err);
        showToast("નેટવર્ક એરર! કૃપા કરીને ફરી પ્રયત્ન કરો.", true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> આ યુનિટમાં ટોપિક સેવ કરો`;
      }
    }

    async function saveBackupVideo() {
      const rawText = document.getElementById('backupRawInput').value.trim();
      const saveBackupBtn = document.getElementById('btnSaveBackup');

      if (!rawText) {
        showToast("બેકઅપ વિડિયોનો ટેક્સ્ટ પેસ્ટ કરો!", true);
        return;
      }

      const backupParsed = parseCustomText(rawText);
      saveBackupBtn.disabled = true;
      saveBackupBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> સેવ થાય છે...`;

      try {
        const res = await fetch(`${FIREBASE_BASE_URL}/${activeTopicId}/backup.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(backupParsed)
        });

        if (res.ok) {
          document.getElementById('backupRawInput').value = '';
          document.getElementById('backupFormWrap').style.display = 'none';
          await fetchTopics();
          openDetailModal(activeTopicId);
          showToast("બેકઅપ વિડિયો સફળતાપૂર્વક સેવ થયો!");
        } else {
          showToast("બેકઅપ સેવ ના થઈ શક્યો!", true);
        }
      } catch (err) {
        console.error("Backup save error:", err);
        showToast("એરર આવી!", true);
      } finally {
        saveBackupBtn.disabled = false;
        saveBackupBtn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Backup સેવ કરો`;
      }
    }

    async function deleteTopic(e, id) {
      e.stopPropagation();
      const confirmed = window.confirm("શું તમારે આ ટોપિક કાયમ માટે ડિલીટ કરવો છે?");
      if (!confirmed) return;

      try {
        const res = await fetch(`${FIREBASE_BASE_URL}/${id}.json`, { method: 'DELETE' });
        if (res.ok) {
          await fetchTopics();
          showToast("ટોપિક ડિલીટ થઈ ગયો!");
        } else {
          showToast("ડિલીટ કરવામાં સમસ્યા આવી!", true);
        }
      } catch (err) {
        console.error("Delete error:", err);
        showToast("નેટવર્ક એરર!", true);
      }
    }

    function openDetailModal(id) {
      activeTopicId = id;
      const topicObj = topicsCache.find(t => t.id === id);
      if (!topicObj) return;

      document.getElementById('modalTopic').innerText = `🎯 ${topicObj.topic}`;
      document.getElementById('modalTitle').innerText = topicObj.title;
      document.getElementById('modalChannel').innerText = topicObj.channel;
      document.getElementById('modalDuration').innerText = topicObj.duration;
      document.getElementById('modalYtLink').href = topicObj.link;

      const backupDisplay = document.getElementById('backupDisplay');
      if (topicObj.backup) {
        backupDisplay.innerHTML = `
          <div class="backup-view-card">
            <div class="detail-row">
              <span class="detail-label"><i class="fa-solid fa-video"></i> Backup Title:</span>
              <span class="detail-value">${topicObj.backup.title}</span>
            </div>
            <div class="detail-row" style="margin-top: 6px;">
              <span class="detail-label"><i class="fa-solid fa-chalkboard-user"></i> Channel:</span>
              <span class="detail-value">${topicObj.backup.channel}</span>
            </div>
            <div class="detail-row" style="margin-top: 6px;">
              <span class="detail-label"><i class="fa-solid fa-clock"></i> Duration:</span>
              <span class="detail-value">${topicObj.backup.duration}</span>
            </div>
            <a href="${topicObj.backup.link}" target="_blank" rel="noopener noreferrer" class="btn-youtube-launch" style="background: linear-gradient(135deg, #d97706 0%, #b45309 100%); margin-top: 14px; font-size: 13.5px; padding: 10px 16px;">
              <i class="fa-brands fa-youtube"></i> Backup વિડિયો ખોલો
            </a>
          </div>
        `;
      } else {
        backupDisplay.innerHTML = `<p style="font-size: 13px; color: var(--text-muted); margin: 6px 0;">કોઈ બેકઅપ વિડિયો ઉમેરેલ નથી.</p>`;
      }

      document.getElementById('backupFormWrap').style.display = 'none';
      document.getElementById('detailModal').style.display = 'flex';
    }

    function toggleBackupForm() {
      const wrap = document.getElementById('backupFormWrap');
      wrap.style.display = wrap.style.display === 'block' ? 'none' : 'block';
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
      activeTopicId = null;
    }

    // Close modal when tapping backdrop outside dialog
    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') {
        closeModal();
      }
    });

    // Run on initial load
    fetchTopics();
  </script>
</body>
</html>
